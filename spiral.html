<!doctype html>
<html>
<head>
<style></style>
<script src='spork.js'></script>
<script>
function spiralQuad(x1,y1, x2,y2, x3,y3, x4,y4, R){
	quad(x1,y1, x2,y2, x3,y3, x4,y4);
	var dx1=x2-x1;
	var dy1=y2-y1;
	
	var dx2=x3-x2;
	var dy2=y3-y2;
	
	var dx3=x4-x3;
	var dy3=y4-y3;
	
	var dx4=x1-x4;
	var dy4=y1-y4;
	
	var d1=sqrt(dx1*dx1+dy1*dy1);
	var d2=sqrt(dx2*dx2+dy2*dy2);
	var d3=sqrt(dx3*dx3+dy3*dy3);
	var d4=sqrt(dx4*dx4+dy4*dy4);
	
	if (min(d1, d2, d3, d4)>R){
		dx1=dx1/d1;
		dy1=dy1/d1;
		dx2=dx2/d2;
		dy2=dy2/d2;
		dx3=dx3/d3;
		dy3=dy3/d3;
		dx4=dx4/d4;
		dy4=dy4/d4;
		x1+=R*dx1; y1+=R*dy1;
		x2+=R*dx2; y2+=R*dy2;
		x3+=R*dx3; y3+=R*dy3;
		x4+=R*dx4; y4+=R*dy4;
		spiralQuad(x1,y1, x2,y2, x3,y3, x4,y4, R);
	}
	else fill();
}




function setup(){}
function randomNearHalf(r){
	if ((r==null) || (r>0.5)) r=0.3;
		return(0.5-r+random()*2*r);
}
function draw(){
	var x=randomNearHalf(0.3)*width;
	var y=randomNearHalf(0.3)*height;
	var D=5;
	spiralQuad(0,0, width/2, 0, x, y, 0, height/2, D);
	spiralQuad(width,0, width/2, 0, x, y, width, height/2, D);
	spiralQuad(0,height, width/2, height, x, y, 0, height/2, D);
	spiralQuad(width,height, width/2, height, x, y, width, height/2, D);	
	//linewidth(5);color('red'); point(x,y);
}
</script>
</head>
<body>
<div id='spork'></div>
</body>
</html>
