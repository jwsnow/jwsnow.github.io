<!doctype html>
<html lang="en">
<head>

  <title>Statistics Diagnostic & Practice Center</title>
  <link rel="stylesheet" href="styles.css">

      tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]],processEscapes:true},
